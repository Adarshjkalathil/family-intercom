# coturn configuration for the TV intercom relay.
# Installed to /etc/turnserver.conf by deploy/setup.sh, which fills in the
# placeholders below.

# --- identity -------------------------------------------------------------
# listening-ip is the VM's PRIVATE address (Oracle gives the instance a private
# IP and NATs the public one onto it). external-ip maps private to public so
# coturn advertises candidates that are actually reachable.
listening-ip=__PRIVATE_IP__
external-ip=__PUBLIC_IP__/__PRIVATE_IP__
realm=__PUBLIC_HOST__
server-name=__PUBLIC_HOST__

# --- ports ----------------------------------------------------------------
listening-port=3478
tls-listening-port=5349
# Keep the relay range small and open exactly this range in the firewall.
# 200 ports is far more than a handful of family devices will ever need.
min-port=49160
max-port=49360

# --- authentication -------------------------------------------------------
# Time-limited credentials derived by the signalling server via HMAC-SHA1.
# There is no user database: a credential that leaks expires within hours.
use-auth-secret
static-auth-secret=__TURN_SECRET__

# --- TLS ------------------------------------------------------------------
# Shares the Let's Encrypt certificate with the signalling server.
cert=/etc/letsencrypt/live/__PUBLIC_HOST__/fullchain.pem
pkey=/etc/letsencrypt/live/__PUBLIC_HOST__/privkey.pem
# TLS 1.0/1.1 are dead; refusing them costs us nothing.
no-tlsv1
no-tlsv1_1

# --- hardening ------------------------------------------------------------
# An open TURN relay will be found and abused within days. These matter.
no-cli
no-multicast-peers
# Stop the relay being used to reach private networks, including our own VM.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Generous enough for 1080p, tight enough that abuse is capped.
user-quota=12
total-quota=100
bps-capacity=0

# --- logging --------------------------------------------------------------
log-file=/var/log/turnserver.log
simple-log
# Flip to 1 while debugging a call that will not connect; it is noisy.
verbose=0
