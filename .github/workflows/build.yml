name: Build APKs

# Every push builds both apps and attaches them as downloadable artifacts, so
# you never need Android Studio or 15GB of SDK on your own machine.
#
# The job is ordered to get the most information out of each run, because
# without a local toolchain every fix costs a full round trip: the cheap checks
# run first and report, but they do not stop the build, so one run can tell you
# about a bad dependency version AND the compiler errors behind it.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  server-tests:
    name: Server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The tests use the built-in WebSocket client, which Node 20 lacks.
          # The server itself still runs on Node 20 (see deploy/setup.sh).
          node-version: '22'

      # The server has no dependencies, so there is nothing to install.
      - name: Run signalling tests
        working-directory: server
        run: npm test

  cloudflare-tests:
    name: Cloudflare Worker tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json

      - name: Install wrangler
        working-directory: cloudflare
        run: npm ci --no-audit --no-fund

      # Runs server/test's suites against the Worker under `wrangler dev`, so
      # both implementations stay on one protocol. No Cloudflare account needed.
      - name: Run signalling tests against the Worker
        working-directory: cloudflare
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: npm test

  android:
    name: Build TV and phone APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---- seconds-long checks, run first, never blocking -------------------

      - name: Check dependency versions exist
        continue-on-error: true
        run: python3 tools/check-deps.py

      - name: Pre-flight resource and manifest checks
        continue-on-error: true
        run: python3 tools/preflight.py

      # A signing key and Firebase settings kept as repository secrets rather
      # than files. Files already in the checkout win. See android/keystore/README.md.
      - name: Use the signing key and Firebase settings from secrets
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ ! -f keystore/release.properties ]; then
            mkdir -p keystore
            echo "$KEYSTORE_BASE64" | base64 -d > keystore/release.jks
            printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=intercom\nkeyPassword=%s\n' \
              "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > keystore/release.properties
          fi
          if [ -n "$GOOGLE_SERVICES_JSON" ] && [ ! -f phone/google-services.json ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > phone/google-services.json
          fi
          if [ -f keystore/release.properties ]; then
            echo "::notice::Signing with your release key."
          else
            echo "::warning::No signing key, so these APKs use a throwaway debug key and will not install over a previous build. See android/keystore/README.md."
          fi

      - name: Report Firebase configuration
        working-directory: android
        run: |
          if [ -f phone/google-services.json ]; then
            echo "::notice::google-services.json found - the phone app will support push."
          else
            echo "::warning::No android/phone/google-services.json. The phone app will build, but it will only ring while the app is open. See docs/02-firebase.md."
          fi

      # ---- the real build ---------------------------------------------------

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # No wrapper is committed, so the version is pinned here instead.
          # Must stay compatible with the AGP version in libs.versions.toml.
          gradle-version: '8.11.1'
          # Caches dependencies between runs, so a second attempt is minutes
          # faster than the first.
          cache-read-only: false

      # --continue means a failure in one module still reports the other's
      # errors, rather than hiding them behind the first stack trace.
      - name: Test and build
        working-directory: android
        run: |
          gradle --no-daemon --stacktrace --continue \
            :core:test \
            :tv:assembleRelease \
            :phone:assembleRelease

      - name: Collect APKs
        run: |
          mkdir -p out
          cp android/tv/build/outputs/apk/release/*.apk    out/family-intercom-tv.apk
          cp android/phone/build/outputs/apk/release/*.apk out/family-intercom-phone.apk
          ls -lh out

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: out/*.apk
          retention-days: 90

      # On failure, keep everything needed to diagnose without re-running.
      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            android/**/build/reports/
            android/**/build/outputs/logs/
            android/**/build/tmp/**/*.txt
          retention-days: 14
